<!-- Expense tracker -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  
  <div class="parent">
    <div class="div1">Expense Tracker</div>
    <div class="div2">
      <h2> Update Expense </h2>
      <br>
      <form>
        <br><br>
        <input type="text" id="update-name" placeholder="Enter expense name">
        <br><br>
        <input type="number" id="update-amount" placeholder="Enter amount">
        <br><br>
        <select name="category" id="update-category">
          <option value="food">Food</option>
          <option value="travel">Travel</option>
          <option value="shopping">shopping</option>
        </select>
        <br><br>
        <button type="submit">Update Expense</button>
      </form>
    </div>
    <div class="div3">
      <form>
        <input type="text" id="name" placeholder="Enter expense name">
        <input type="number" id="amount" placeholder="Enter amount">
        <select name="category" id="category">
          <option value="food">Food</option>
          <option value="travel">Travel</option>
          <option value="shopping">shopping</option>
        </select>
        <br>
        <button id="add">Add Expense</button>
      </form>
    </div>
    <div class="div5">
      <h>
        Food: <br><span id="food-expense">0</span>
      </h>
    </div>
    <div class="div6">
      <h>
        Travel:<br> <span id="travel">0</span>
      </h>
    </div>
    <div class="div7">
      <h>
        Shopping:<br> <span id="shopping">0</span>
      </h>
    </div>
    <div class="div8"><h>
      Total Expense:<br> <span id="total-expense">0</span>
    </h></div>
    <div class="div9">
      <h2>Expense List</h2>
      <ol>
        
      </ol>
    </div>
  </div>
  <script src="script.js"></script>  
</body>
</html>
