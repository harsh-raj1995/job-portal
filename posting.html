<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="posting.css">
    <title>Document</title>
</head>
<body>
    
<div class="parent">
    <div class="div1">
        <label name="search-form">Search Jobs</label>
        <input id="search-input" placeholder="Search job here">
    </div>
    <div class="div2">
        <h2>Post a Job</h2>
        <section style="padding-top: 10%;">
        <form id="jobForm">

            <label>Job Title</label>
            <input type="text" id="jobTitle" required>

            <label>Company Name</label>
            <input type="text" id="companyName" required>

            <label>Location</label>
            <input type="text" id="location" required>
            <label>Job Description</label>
            <textarea id="jobDescription" required></textarea>

            <label>Salary</label>
            <input type="text" id="salary" required><br>

            <button type="submit">Post Job</button>

        </form>
        </section>
    </div>
     <div class="div3">
        <h2>Available Jobs</h2>
        <div id="jobCardsContainer"></div>
    </div>
</div>
